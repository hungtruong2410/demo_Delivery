# Xóa dòng "version: 3.8" ở trên cùng (nó đã lỗi thời)
services:
  # Dịch vụ 1: Ứng dụng Node.js của bạn
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db: # <-- THAY ĐỔI QUAN TRỌNG Ở ĐÂY
        condition: service_healthy # Chỉ khởi động app khi db "khỏe mạnh"

  # Dịch vụ 2: Database MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./FoodOrderingWebsite.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    
    # THÊM MỚI TỪ ĐÂY
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # HẾT PHẦN THÊM MỚI

volumes:
  db_data: