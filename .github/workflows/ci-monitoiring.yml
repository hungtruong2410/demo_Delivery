name: CI - Test & Push Metrics

on:
  push:
    branches: [ main ]

jobs:
  build-and-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests & generate junit.xml
        run: npm test

      - name: Upload JUnit Test Result to Datadog
        run: |
          npx datadog-ci junit upload reports/junit.xml \
            --service food-ordering \
            --tags branch:${GITHUB_REF_NAME}
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: us5.datadoghq.com
