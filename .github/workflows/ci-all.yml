name: CI - Full Pipeline (Build, Test, Monitor)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  integration-pipeline:
    runs-on: ubuntu-latest

    # 1. BIẾN MÔI TRƯỜNG TOÀN CỤC (Quan trọng: Để mọi bước đều đọc được DB)
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NODE_ENV: test
      mysql_host: 127.0.0.1 

    # 2. Dựng MySQL Service (Dùng bản 5.7 để ổn định nhất, tránh lỗi plugin auth)
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
        ports:
          - 3306:3306
        # Options đơn giản để không làm crash container
        options: >-
          --health-cmd="mysqladmin ping" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          # Cài thêm các gói cần thiết cho CI
          npm install jest-junit cross-env --no-save 

      # 3. Chờ MySQL khởi động xong
      - name: Wait for MySQL Ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p"${{ secrets.DB_PASSWORD }}" --silent; then
              echo "✅ MySQL is up!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      # 4. Import Database (ĐÃ SỬA ĐƯỜNG DẪN FILE SQL)
      - name: Import Database Schema
        run: |
          sudo apt-get install -y mysql-client
          # Đã bỏ chữ 'database/' đi vì file nằm ở root
          mysql -h 127.0.0.1 -P 3306 -u root -p"${{ secrets.DB_PASSWORD }}" ${{ secrets.DB_NAME }} < FoodOrderingWebsite.sql

      # 5. Chạy Test (Unit & Integration)
      - name: Run Tests
        run: npx jest --reporters=default --reporters=jest-junit --detectOpenHandles
        env:
          JEST_JUNIT_OUTPUT_DIR: "reports"
          JEST_JUNIT_OUTPUT_NAME: "junit.xml"
      
      # 6. Upload báo cáo lên Datadog
      - name: Upload Test Report to Datadog
        if: always() 
        run: |
          npx @datadog/datadog-ci junit upload reports/junit.xml \
            --service food-ordering \
            --tags branch:${GITHUB_REF_NAME}
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: us5.datadoghq.com

      # 7. Smoke Test (Khởi động server thật để kiểm tra)
      - name: Start server and verify health
        run: |
          # Chạy server ở background
          nohup npm start > server.log 2>&1 &
          SERVER_PID=$!
          
          echo "Waiting for server to launch..."
          sleep 10
          
          # Kiểm tra server sống hay chết
          if curl --fail -I http://localhost:3000; then
            echo "✅ Server started successfully!"
          else
            echo "❌ Server failed to start. Logs:"
            cat server.log
            exit 1
          fi
          
          kill $SERVER_PID