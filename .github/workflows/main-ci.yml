name: CI - Build & Test Node App

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: foodorderingwesitedb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -psecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Import DB schema
        run: mysql -h 127.0.0.1 -uroot -psecret foodorderingwesitedb < FoodOrderingWebsite.sql

      - name: Create .env
        run: |
          cat > .env <<EOF
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=secret
          DB_NAME=foodorderingwesitedb
          NODE_ENV=test
          EOF

      - name: Run test server
        run: |
          nohup npm start > server.log 2>&1 &
          sleep 10
          curl -I http://localhost:3000 || (cat server.log && false)
