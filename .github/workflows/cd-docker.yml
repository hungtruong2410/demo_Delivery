name: CD - Deploy to Local Mac

on:
  push:
    branches: [ "main" ]
  # Chỉ chạy CD sau khi CI đã pass (tùy chọn, hiện tại cứ để chạy song song cũng được)

jobs:
  deploy:
    # QUAN TRỌNG: Đổi từ 'ubuntu-latest' sang 'self-hosted'
    # Lúc này GitHub sẽ tìm máy Mac của bạn để chạy lệnh
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Vì code chạy ngay trên máy Mac của bạn rồi,
      # nên không cần SSH gì cả. Gọi thẳng script deploy luôn!
      - name: Deploy to Mac Server
        run: |
          echo "🚀 Starting deployment on local Mac..."
          
          # Đảm bảo script có quyền thực thi
          chmod +x ~/deploy_food_ordering.sh
          
          # Chạy script deploy
          bash ~/deploy_food_ordering.sh
          
          echo "✅ Deployment finished!"