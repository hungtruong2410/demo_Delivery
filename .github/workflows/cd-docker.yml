name: CD - Deploy Docker

on:
  # Chỉ chạy sau khi workflow CI hoàn thành
  workflow_run:
    workflows: ["CI - Build & Test Node App"]
    types:
      - completed

jobs:
  build-and-push:
    # Chỉ chạy nếu CI kết luận là success
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
      # Đăng nhập Docker Hub bằng secrets trong repo
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE }}:latest
            ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on remote Docker host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Vào thư mục project trên server (bạn chỉnh lại cho đúng)
            cd /home/${{ secrets.SSH_USER }}/demo_Delivery-main

            # Kéo code mới nhất (nếu bạn deploy theo docker-compose dùng image)
            git pull origin main

            # Update image mới & restart services
            docker compose pull
            docker compose up -d
